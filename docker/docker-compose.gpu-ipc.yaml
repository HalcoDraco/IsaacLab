# Docker Compose overlay that enables CUDA IPC between the container and host.
#
# This sets  ipc: host  so that the container shares the host's POSIX IPC
# namespace (required by PyTorch's CUDA IPC reference-counter mechanism)
# and the host can open cudaIpcMemHandle_t handles exported by the container.
#
# Usage:
#   python docker/container.py start --files docker-compose.gpu-ipc.yaml
#
# Or programmatically via ContainerInterface.start_with_gpu_ipc().

services:
  isaac-lab-base:
    ipc: host
